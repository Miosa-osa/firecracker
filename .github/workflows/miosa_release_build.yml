# MIOSA fork: build this branch's release binary in Firecracker's own dev
# container and run the TSC unification tests (one of them needs /dev/kvm).
# Artifact: the static x86_64 musl firecracker binary and its sha256, the input
# to a deploy/host-spec/hypervisor.tsv row in miosa-compute.
name: MIOSA release build

on:
  pull_request:
    branches: [miosa-v1.17]
  push:
    branches: [miosa-v1.17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: TSC unit tests
        run: tools/devtool -y sh "cargo test -p vmm --lib -- tsc"

      - name: Release build (x86_64 musl)
        run: tools/devtool -y build --release

      - name: Checksum
        run: |
          bin=build/cargo_target/x86_64-unknown-linux-musl/release/firecracker
          ls -l "$bin"
          "$bin" --version
          sha256sum "$bin" | tee firecracker.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: firecracker-x86_64-musl
          path: |
            build/cargo_target/x86_64-unknown-linux-musl/release/firecracker
            firecracker.sha256
